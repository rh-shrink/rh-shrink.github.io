name: Schedule test
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "event=$GITHUB_EVENT_NAME actor=$GITHUB_ACTOR triggering_actor=$GITHUB_TRIGGERING_ACTOR at $(date -u +%FT%TZ)"
