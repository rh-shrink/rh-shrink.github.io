name: Update

on:
  schedule:
    # Every 15 minutes, off the busy full and quarter hours: GitHub delays or drops
    # scheduled runs under load, most at those times.
    - cron: "7,22,37,52 * * * *"
    # Daily as well: GitHub drops infrequent schedules less often, so this one may keep working
    # if the scheduler starts serving this repository.
    - cron: "41 4 * * *"
  # GitHub's scheduler did not start any scheduled run in this repository (2026-11-22), so an
  # external cron service (cron-job.org) starts the workflow every 15 minutes with source
  # external-cron; such runs count as scheduled polls.
  workflow_dispatch:
    inputs:
      source:
        description: Who starts this run (cron-job.org sends it; GitHub rejects undeclared inputs)
        default: manual
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

env:
  SOURCE: https://github.com/leanprover-community/riemann-hypothesis
  # The earlier history, before main was replaced on 2026-11-25 (by the readable edition of
  # grh-lean): main up to this commit, still on the branch alpoge. The page shows it before main
  # (site/earlier.json, measured again only when collect.py's VERSION changes), and the import
  # graph of its first commit, the original (site/graph-earlier.json, again only when graph.py's
  # VERSION changes).
  EARLIER: 756a70250dcba9162b99d4ea35c186558434c17e
  # Up to three attempts, for brief network failures.
  RETRY: 'retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed: $*" >&2; sleep 15; done; return 1; }'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hanging run must not hold up the queued ones; measuring all commits takes ~5 min
    permissions:
      contents: write
      actions: read  # the run list, for the time of the last timer run
    outputs:
      deploy: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$RETRY"
          head=$(retry git ls-remote "$SOURCE" refs/heads/main | cut -f1)
          # Data of another version is measured again (collect.py VERSION).
          last=$(python3 -c 'import json, collect; d = json.load(open("site/data.json")); c = d["commits"]; print(c[-1]["sha"] if c and d.get("version") == collect.VERSION else "")')
          echo "source main: $head, last measured: $last"
          earlier=$(python3 -c 'import json, collect; d = json.load(open("site/earlier.json")); print("current" if d.get("version") == collect.VERSION and d["commits"][-1]["sha"] == "${{ env.EARLIER }}" else "stale")' 2>/dev/null || echo stale)
          echo "earlier history: $earlier"
          echo "earlier=$earlier" >> "$GITHUB_OUTPUT"
          # The page shows "polled" as "last at" (any run), and warns when "scheduled" is over 30 min
          # old: the start of the last run of the timer (cron-job.org's dispatches, or GitHub's
          # schedule), from GitHub's run list, which includes this run. (Carrying it over from the
          # live polled.json failed: right after a deploy the site may still serve the old file.)
          now=$(date -u +%FT%TZ)
          scheduled=$(retry gh run list -R "$GITHUB_REPOSITORY" --workflow update.yml --limit 40 --json event,createdAt \
            --jq '[.[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].createdAt // ""')
          echo "{\"polled\":\"$now\",\"scheduled\":\"$scheduled\"}" > site/polled.json
          cat site/polled.json
          # The import graph pictures (graph.json, not committed): the live file when it is of this
          # commit and of this graph.py VERSION, otherwise computed again below.
          gv=$(sed -n 's/^VERSION = \([0-9]*\).*/\1/p' graph.py)
          # no retries: a missing file is an answer
          # (kept in $RUNNER_TEMP too: graph.py takes over its "original", which never changes)
          if curl -fs --max-time 30 "https://rh-shrink.github.io/graph.json?t=$RANDOM" -o site/graph.json && cp site/graph.json "$RUNNER_TEMP/graph-live.json" &&
             python3 -c 'import json, sys; g = json.load(open("site/graph.json")); sys.exit(g.get("version") != int(sys.argv[1]) or g["now"]["sha"] != sys.argv[2])' "$gv" "$head"; then
            graph=current
          else
            rm -f site/graph.json; graph=stale
          fi
          echo "import graph: $graph"
          graph_earlier=$(python3 -c 'import json, sys; sys.exit(json.load(open("site/graph-earlier.json")).get("version") != int(sys.argv[1]))' "$gv" 2>/dev/null && echo current || echo stale)
          echo "import graph of the original: $graph_earlier"
          echo "graph_earlier=$graph_earlier" >> "$GITHUB_OUTPUT"
          echo "graph=$graph" >> "$GITHUB_OUTPUT"
          echo "new=$([ "$head" != "$last" ] || [ "$graph" = stale ] || [ "$earlier" = stale ] || [ "$graph_earlier" = stale ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # numpy for graph.py, Pillow for card.py
      - name: Python packages
        continue-on-error: true
        run: |
          eval "$RETRY"
          python3 -m venv "$RUNNER_TEMP/venv"
          retry "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy pillow

      - name: Measure new commits
        if: steps.check.outputs.new == 'true'
        run: |
          eval "$RETRY"
          clone() { rm -rf "$RUNNER_TEMP/source.git"; git clone --quiet --bare --single-branch --branch main "$SOURCE" "$RUNNER_TEMP/source.git"; }
          retry clone
          "$RUNNER_TEMP/venv/bin/python" collect.py "$RUNNER_TEMP/source.git" site/data.json
          if [ "${{ steps.check.outputs.earlier }}" = stale ] || [ "${{ steps.check.outputs.graph_earlier }}" = stale ]; then
            retry git -C "$RUNNER_TEMP/source.git" fetch --quiet "$SOURCE" "$EARLIER"
          fi
          if [ "${{ steps.check.outputs.earlier }}" = stale ]; then
            "$RUNNER_TEMP/venv/bin/python" collect.py "$RUNNER_TEMP/source.git" site/earlier.json --ref "$EARLIER"
          fi
          if [ "${{ steps.check.outputs.graph_earlier }}" = stale ]; then
            original=$(git -C "$RUNNER_TEMP/source.git" rev-list --first-parent "$EARLIER" | tail -1)
            "$RUNNER_TEMP/venv/bin/python" graph.py "$RUNNER_TEMP/source.git" site/graph-earlier.json --ref "$original" --only
          fi

      - name: Commit data
        id: commit
        run: |
          eval "$RETRY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub disables scheduled workflows after 60 days without repository activity.
          if git diff --quiet site/data.json site/earlier.json site/graph-earlier.json && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%FT%TZ > .heartbeat
            git add .heartbeat
          fi
          git add site/data.json site/earlier.json site/graph-earlier.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit --quiet -m "Update data"
            # a push to this repository since the checkout (a change of the page) is pulled first
            retry sh -c 'git pull --rebase --quiet && git push --quiet'
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Without it the page leaves out the import graph pictures; the deploy goes on.
      - name: Import graph
        if: steps.check.outputs.graph == 'stale'
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/venv/bin/python" graph.py "$RUNNER_TEMP/source.git" site/graph.json --reuse "$RUNNER_TEMP/graph-live.json"

      # The link preview (Open Graph image); not committed. A failure here must not stop the deploy.
      - name: Draw link preview
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/venv/bin/python" card.py site/data.json site/card.png

      # Every run deploys, so that polled.json is current. Uploaded here, not in the deploy job:
      # deploy-pages may not yet see an artifact uploaded moments before in the same job
      # (actions/deploy-pages#451).
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: measure
    if: needs.measure.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
