name: Update

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

env:
  SOURCE: https://github.com/leanprover-community/riemann-hypothesis

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for new commits
        id: check
        run: |
          head=$(git ls-remote "$SOURCE" refs/heads/main | cut -f1)
          last=$(python3 -c 'import json; c = json.load(open("site/data.json"))["commits"]; print(c[-1]["sha"] if c else "")')
          echo "source main: $head, last measured: $last"
          echo "new=$([ "$head" != "$last" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Measure new commits
        if: steps.check.outputs.new == 'true'
        run: |
          git clone --quiet --bare --single-branch --branch main "$SOURCE" "$RUNNER_TEMP/source.git"
          python3 collect.py "$RUNNER_TEMP/source.git" site/data.json

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub disables scheduled workflows after 60 days without repository activity.
          if git diff --quiet site/data.json && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%FT%TZ > .heartbeat
            git add .heartbeat
          fi
          git add site/data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit --quiet -m "Update data"
            git push --quiet
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Uploaded here, not in the deploy job: deploy-pages may not yet see an artifact
      # uploaded moments before in the same job (actions/deploy-pages#451).
      - name: Upload site
        id: upload
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: measure
    if: needs.measure.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
