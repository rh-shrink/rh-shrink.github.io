name: Update

on:
  schedule:
    # Every 15 minutes, off the busy full and quarter hours: GitHub delays or drops
    # scheduled runs under load, most at those times.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

env:
  SOURCE: https://github.com/leanprover-community/riemann-hypothesis
  # Up to three attempts, for brief network failures.
  RETRY: 'retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed: $*" >&2; sleep 15; done; return 1; }'

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hanging run must not hold up the queued ones
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for new commits
        id: check
        run: |
          eval "$RETRY"
          head=$(retry git ls-remote "$SOURCE" refs/heads/main | cut -f1)
          last=$(python3 -c 'import json; c = json.load(open("site/data.json"))["commits"]; print(c[-1]["sha"] if c else "")')
          echo "source main: $head, last measured: $last"
          # The page shows "polled" as "last at" (any run), and warns when "scheduled" (the last run
          # started by the schedule, carried over from the live file otherwise) is over 30 min old.
          now=$(date -u +%FT%TZ)
          live=$(retry curl -fs "https://rh-shrink.github.io/polled.json?t=$RANDOM" || echo '{}')
          scheduled=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1]).get("scheduled", ""))' "$live")
          [ "$GITHUB_EVENT_NAME" = schedule ] && scheduled=$now
          echo "{\"polled\":\"$now\",\"scheduled\":\"$scheduled\"}" > site/polled.json
          cat site/polled.json
          echo "new=$([ "$head" != "$last" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Measure new commits
        if: steps.check.outputs.new == 'true'
        run: |
          eval "$RETRY"
          clone() { rm -rf "$RUNNER_TEMP/source.git"; git clone --quiet --bare --single-branch --branch main "$SOURCE" "$RUNNER_TEMP/source.git"; }
          retry clone
          python3 collect.py "$RUNNER_TEMP/source.git" site/data.json

      - name: Commit data
        id: commit
        run: |
          eval "$RETRY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub disables scheduled workflows after 60 days without repository activity.
          if git diff --quiet site/data.json && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u +%FT%TZ > .heartbeat
            git add .heartbeat
          fi
          git add site/data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit --quiet -m "Update data"
            retry git push --quiet
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Every run deploys, so that polled.json is current. Uploaded here, not in the deploy job:
      # deploy-pages may not yet see an artifact uploaded moments before in the same job
      # (actions/deploy-pages#451).
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: measure
    if: needs.measure.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
